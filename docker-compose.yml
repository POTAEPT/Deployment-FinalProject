# รันทั้งระบบในเครื่อง: docker compose up -d --build --wait
# ตอนนี้มี auth-service + frontend (http://localhost:8080) service อื่นเพิ่มต่อใน services: ได้เลย

services:
  auth-service:
    build: ./backend/auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      # ต้องตรงกับ task-service (ค่าสำหรับพัฒนาเท่านั้น)
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      USERS_FILE: /app/data/users.json
    volumes:
      # ใช้ named volume (ไม่ใช่โฟลเดอร์ในเครื่อง) เพื่อให้ได้สิทธิ์ node:node จาก image
      - auth-data:/app/data

  notification-service:
    build: ./backend/notification-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005

  task-service:
    build: ./backend/task-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      # ต้องตรงกับ auth-service (ค่าสำหรับพัฒนาเท่านั้น)
      JWT_SECRET: ${JWT_SECRET:-dev-secret}

  timer-service:
    build: ./backend/timer-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      HISTORY_URL: http://history-service:3004
      NOTIFY_URL: http://notification-service:3005
      # ค่าเริ่มต้น 25/5/15 นาที ตอนทดสอบรัน FOCUS_SECONDS=1 docker compose up ... ได้
      FOCUS_SECONDS: ${FOCUS_SECONDS:-1500}
      SHORT_BREAK_SECONDS: ${SHORT_BREAK_SECONDS:-300}
      LONG_BREAK_SECONDS: ${LONG_BREAK_SECONDS:-900}
    # history-service ยังไม่มี (timer เรียก history แบบ best-effort ไม่พัง) เติมใน depends_on เมื่อเพิ่ม history แล้ว
    depends_on:
      notification-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    # รอ backend ผ่าน healthcheck ก่อนค่อยเปิดหน้าเว็บ (เพิ่ม service อื่นตรงนี้เมื่อมีแล้ว)
    depends_on:
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      timer-service:
        condition: service_healthy
      task-service:
        condition: service_healthy

volumes:
  auth-data:
