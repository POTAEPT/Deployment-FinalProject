name: notification-service

on:
  # Test changes to notification-service on every relevant PR.
  pull_request:
    paths:
      - "backend/notification-service/**"
      - ".github/workflows/notification-service.yml"
  push:
    # Run the checks again after changes are merged into main.
    branches: [main]
    paths:
      - "backend/notification-service/**"
      - ".github/workflows/notification-service.yml"
    # A notification-service-v* tag publishes an image to Docker Hub.
    tags: ["notification-service-v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/notification-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/notification-service/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  # Verify the Dockerfile on PRs without publishing an image.
  docker-build:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend/notification-service
          push: false

  release:
    if: startsWith(github.ref, 'refs/tags/notification-service-v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "version=${GITHUB_REF_NAME#notification-service-v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: backend/notification-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest
