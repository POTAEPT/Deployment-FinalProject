server {
    listen 8080;
    root /usr/share/nginx/html;

    # บีบอัดไฟล์ข้อความก่อนส่ง (index.html, JS, CSS โหลดเร็วขึ้น)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # health check แบบเดียวกับ service อื่น (docker compose --wait ใช้)
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # ไฟล์ใน /assets มี hash ในชื่อ (เช่น index-C6WZPeWr.js) build ใหม่ชื่อจะเปลี่ยน จึง cache ได้นาน
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ทุก path ที่ไม่ใช่ไฟล์จริงให้ส่ง index.html (React จัดการหน้าเอง)
    # index.html ห้าม cache เพื่อให้ deploy ใหม่แล้วเบราว์เซอร์ได้ JS ตัวใหม่ทันที
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
